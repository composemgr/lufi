# nginx proxy address - http://172.17.0.1:64241

name: lufi
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: silkeh/lufi:latest
    container_name: lufi-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: lufi-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      LUFI_CONTACT: ${LUFI_CONTACT:-admin@example.com}
      LUFI_SECRETS: ${APP_SECRET_KEY:-replace-with-a-random-secret-min-32-chars}
      LUFI_MAX_FILE_SIZE: ${LUFI_MAX_FILE_SIZE:-104857600}
      LUFI_DEFAULT_DELAY: ${LUFI_DEFAULT_DELAY:-0}
      LUFI_MAX_DELAY: ${LUFI_MAX_DELAY:-0}
    volumes:
      - './volumes/config/lufi:/lufi/config:z'
      - './volumes/data/lufi:/lufi/files:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://lufi-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - lufi
      - cloudflare

networks:
  lufi:
    name: lufi
    external: false
  cloudflare:
    external: true
