# nginx proxy address - http://172.17.0.1:64241

name: lufi
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: silkeh/lufi:latest
    container_name: lufi-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: lufi-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      LUFI_CONTACT: ${LUFI_CONTACT:-admin@example.com}
      LUFI_SECRETS: ${APP_SECRET_KEY:-replace-with-a-random-secret-min-32-chars}
      LUFI_MAX_FILE_SIZE: ${LUFI_MAX_FILE_SIZE:-104857600}
      LUFI_DEFAULT_DELAY: ${LUFI_DEFAULT_DELAY:-0}
      LUFI_MAX_DELAY: ${LUFI_MAX_DELAY:-0}
    volumes:
      - './volumes/config/lufi:/lufi/config:z'
      - './volumes/data/lufi:/lufi/files:z'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.lufi-app.entrypoints=http'
      - 'traefik.http.routers.lufi-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.lufi-app.middlewares=lufi-app-https-redirect'
      - 'traefik.http.middlewares.lufi-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.lufi-app-secure.entrypoints=https'
      - 'traefik.http.routers.lufi-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.lufi-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.lufi-app-secure.service=lufi-app'
      - 'traefik.http.services.lufi-app.loadbalancer.server.port=8080'
    networks:
      - lufi
      - traefik

networks:
  lufi:
    name: lufi
    external: false
  traefik:
    external: true
